aid: hakuto-0209-com
name: HaneruTo
description: >-
  HaneruTo — trading as hakuto, brand B612 SHEEP — is a Japanese one-person, AI-assisted web and systems
  development studio founded in 2025 that also ships b612, a Japanese-market code-review agent for AI coding
  assistants: review checklists by target type, industry presets with mandatory Japanese legal checkpoints
  (景表法 / 特商法 / 薬機法 / インボイス / 電帳法 / 宅建業法 / 介護保険法), failure patterns and 31
  deterministic detection rules — no LLM involved; the server has no input for customer source code.
  b612 is published two ways on mcp.hakuto-0209.com: a remote MCP server at /mcp (Streamable HTTP, protocol
  2025-06-18, ten tools with real inputSchemas, anonymous tools/list, keyless principles/rules) and an A2A
  0.3 agent whose EdDSA-signed card at /.well-known/agent-card.json declares six skills behind an x-b612-key
  licence header, with the signing key at /.well-known/jwks.json. No REST/OpenAPI surface, no SDK, no
  self-serve sign-up; agent access is a monthly flat-fee licence priced on contact.
