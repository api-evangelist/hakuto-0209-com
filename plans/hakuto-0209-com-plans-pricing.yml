description: >-
  b612's agent access has two published tiers and one published price of null: a free keyless tier limited
  to the principles and rules skills at 20 requests/min per IP, and a paid licence sold as "a monthly flat
  fee with a call cap" whose amount "depends on your volume — please contact us". The data policy adds that
  individual and contract developers "can use the existing monthly licence as-is" for agent access, i.e. the
  same b612 licence key covers the Claude Code / Codex integration and the A2A/MCP surface. The company's
  特定商取引法 disclosure page publishes prices for its development service (hakuto AI: ¥100,000/month +
  ¥300,000 initial, ¥50,000 per additional PC, all tax-inclusive, Stripe or bank transfer) but does NOT
  price b612 or the agent surface; those figures are recorded in a note, not as API plans.
