agent_card:
  name: b612
  description: >-
    Japanese-market code review agent. Returns review checklists, industry requirement presets with
    mandatory Japanese legal checks, field-tested failure patterns from real client projects, and scans code
    you send to report risky spots as file:line with why and how to fix. Deterministic checks — no LLM
    inference. Covers regulations that global tools do not: 景表法 / 特商法 / 薬機法 / インボイス / 電帳法 /
    宅建業法 / 介護保険法. Free to try: principles and rules need no key (20 req/min per IP); agent-to-agent
    access is a monthly flat fee with a call cap, priced on contact.
  url: https://mcp.hakuto-0209.com/a2a/v1
  version: 0.1.0
  protocol_version: '0.3'
  preferred_transport: JSONRPC
  provider:
    organization: HaneruTo
    url: https://hakuto-0209.com
  documentation_url: https://mcp.hakuto-0209.com/terms
  capabilities:
    streaming: false
    push_notifications: false
  default_input_modes: [text/plain, application/json]
  default_output_modes: [text/plain]
  security_schemes:
    b612ApiKey: {type: apiKey, in: header, name: x-b612-key}
  security: [{b612ApiKey: []}]
  supports_authenticated_extended_card: false
  supported_interfaces:
  - {url: https://mcp.hakuto-0209.com/a2a/v1, protocolBinding: JSONRPC, protocolVersion: '1.0'}
  - {url: https://mcp.hakuto-0209.com/a2a/v1, protocolBinding: JSONRPC, protocolVersion: '0.3'}
  signatures: 1 (EdDSA, kid b612-a2a-2026-09, verified — see x-evidence)
  skill_count: 6
  skills:
  - {id: principles, name: Review principles / b612 の思考原則, tags: [code-review, principles, engineering-discipline, japanese], keyless: true}
  - {id: review-checklist, name: Review checklist by target type / 対象別レビュー観点, tags: [code-review, checklist, landing-page, ecommerce, saas, japanese]}
  - {id: patterns, name: Field-tested failure patterns / 実戦パターン, tags: [postmortem, lessons-learned, debugging, japanese, line-messaging-api]}
  - {id: domain-preset, name: Industry presets (Japan) / 業種別プリセット, tags: [japanese-law, compliance-jp, keihyoho, tokushoho, yakkiho, invoice-jp, domain-model, requirements]}
  - {id: scan-code, name: Scan code and report findings / コード検査, tags: [static-analysis, code-review, security, bug-detection, japanese]}
  - {id: rules, name: Detection rules / 検出ルール一覧, tags: [static-analysis, transparency, rules], keyless: true}
  skill_invocation: >-
    Every skill carries bilingual examples[] as plain-text prompts (e.g. "What rules does your scanner
    apply?"), inputModes text/plain + application/json and outputModes text/plain. scan-code is the only
    skill that takes source text; the data policy states it is analysed in memory and discarded.
conformance:
  spec: A2A 1.0.0
  grade: conformant
  protocol_version: '0.3'
  preferred_transport: JSONRPC
  hard_checks:
    capabilities_is_object: true
    protocol_version_present: true
    skills_is_array: true
  optional_fields:
    default_input_modes: true
    default_output_modes: true
    preferred_transport: true
  grade_basis: >-
    Graded against the A2A 1.0.0 hard checks. capabilities is an OBJECT (pass) with streaming and
    pushNotifications. protocolVersion is present at the top level (pass), declared as "0.3". skills is an
    ARRAY (pass) of six fully-populated skills, each with id, name, description, tags, examples, inputModes
    and outputModes. All three optional discriminators are present. The card additionally carries the
    1.0.0-style supportedInterfaces[] block (two entries on one URL, protocolVersion 1.0 and 0.3), a
    securitySchemes/security pair, provider, documentationUrl and a verified JWS signature — a more complete
    card than most in the catalog.
  deviations:
  - field: protocolVersion vs supportedInterfaces[].protocolVersion
    observed: top-level "0.3"; supportedInterfaces[] declares both "1.0" and "0.3" for the same JSON-RPC URL
    note: >-
      The card is a hybrid of the 0.3 top-level triple (url/preferredTransport/protocolVersion) and the 1.0
      supportedInterfaces[] block. Internally consistent (one endpoint, one binding) and readable by clients
      written against either revision; recorded because the top-level protocolVersion under-states what the
      interfaces block advertises.
  - field: securitySchemes / security vs observed behaviour
    observed: >-
      The card requires b612ApiKey on every skill while its own description and the endpoint's 401 hint say
      principles and rules are usable without a key; an unauthenticated JSON-RPC POST is refused before
      dispatch (401 on tasks/get).
    note: The keyless tier is real over MCP (tools/list and tools/call b612_principles answered anonymously); over A2A it was not reachable in this probe.
  - field: signatures[]
    observed: present and verifiable
    note: Recorded as a strength, not a fault — see x-evidence.signature_verification.
surface_relationship:
  note: >-
    HaneruTo publishes two agent surfaces on one host, both fronting the same b612 knowledge base. A2A: six
    skills at https://mcp.hakuto-0209.com/a2a/v1 behind x-b612-key. MCP: ten tools at
    https://mcp.hakuto-0209.com/mcp, anonymous tools/list, where four tools (design, reference, grow, notes)
    and the update procedure have no A2A skill counterpart and A2A's scan-code has no MCP tool — the MCP
    server's own instructions state it has no input for source code, so scanning happens client-side
    against b612_rules over MCP but server-side over A2A. No REST/OpenAPI surface exists (see
    mcp/hakuto-0209-com-mcp.yml); a tool crosswalk is therefore not emitted.
