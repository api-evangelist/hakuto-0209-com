- name: b612ApiKey
  type: apiKey
  in: header
  header: x-b612-key
  description: >-
    b612 license key, sent verbatim in the x-b612-key header on both the A2A JSON-RPC endpoint and the MCP
    endpoint. Declared in the agent card as securitySchemes.b612ApiKey ("b612 license key. Contact the
    provider to obtain one.") and required by the card's top-level security[] on every skill. Keys are
    issued by the provider on contact (https://hakuto-0209.com/#contact) under a monthly licence; there is
    no self-serve sign-up or developer console.
  key_handling: >-
    Per the data policy: the key is SHA-256 hashed and only the hash is sent to the licence endpoint for
    validation; the plaintext is never stored or logged; validation results are cached in memory for a few
    minutes. Usage is recorded per licence hash (counts, last use, version, access route) for licence
    management.
