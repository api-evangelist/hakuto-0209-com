apis:
- aid: hakuto-0209-com:b612-mcp-server
  name: b612 MCP Server
  description: >-
    Remote Model Context Protocol server at https://mcp.hakuto-0209.com/mcp (Streamable HTTP, POST only — GET
    returns 406 — protocol version 2025-06-18, serverInfo b612 0.1.0, hosted on Vercel). initialize and
    tools/list answer anonymously with ten tools, every one carrying a real inputSchema and
    execution.taskSupport "forbidden": b612_principles, b612_review_checklist, b612_patterns,
    b612_domain_preset, b612_rules, b612_design, b612_reference, b612_grow, b612_notes and b612_update.
    b612_principles was also callable without a key; the provider's quickstart configures the connection
    with an x-b612-key licence header (`claude mcp add --transport http b612 https://mcp.hakuto-0209.com/mcp
    --header "x-b612-key: <your key>"`). resources/list and prompts/list return -32601. The initialize
    instructions tell the agent to apply checklists and rules to code locally — no source code is sent to
    the server.
  humanURL: https://mcp.hakuto-0209.com/
  baseURL: https://mcp.hakuto-0209.com/mcp
  tags:
  - MCP
  - agent-native
  - Code Review
  properties:
  - type: MCPServer
    url: mcp/hakuto-0209-com-mcp.yml
  - type: MCPServer
    name: b612 MCP endpoint (Streamable HTTP)
    url: https://mcp.hakuto-0209.com/mcp
  - type: Documentation
    url: https://mcp.hakuto-0209.com/
- aid: hakuto-0209-com:b612-a2a-agent
  name: b612 A2A Agent
  description: >-
    Agent2Agent (A2A) protocol surface: an agent card served from
    https://mcp.hakuto-0209.com/.well-known/agent-card.json (protocolVersion 0.3, JSONRPC transport, version
    0.1.0, provider.organization HaneruTo) advertising six skills — principles, review-checklist, patterns,
    domain-preset, scan-code and rules — invoked as plain-text messages at the JSON-RPC endpoint
    https://mcp.hakuto-0209.com/a2a/v1 under an x-b612-key licence header (unkeyed requests get a 401
    `unauthenticated` envelope whose hint names principles and rules as keyless, 20 req/min per IP). The card
    carries an EdDSA JWS signature that verifies against the JWKS at /.well-known/jwks.json (kid
    b612-a2a-2026-09) and is also served unsigned at the legacy /.well-known/agent.json. Streaming and push
    notifications are declared unsupported.
  humanURL: https://mcp.hakuto-0209.com/
  baseURL: https://mcp.hakuto-0209.com/a2a/v1
  tags:
  - A2A
  - agent-native
  - Code Review
  properties:
  - type: AgentCard
    url: a2a/hakuto-0209-com-a2a.yml
  - type: AgentCard
    name: A2A Agent Card (provider-hosted, signed)
    url: https://mcp.hakuto-0209.com/.well-known/agent-card.json
  - type: Documentation
    url: https://mcp.hakuto-0209.com/terms
