summary: >-
  HaneruTo operates ONE remote MCP server, b612, at https://mcp.hakuto-0209.com/mcp — the same host that
  serves its A2A agent card and JSON-RPC endpoint (Vercel origin b612-a2a.vercel.app). It is Streamable HTTP
  (a GET returns 406 application/json; POST with Accept: application/json, text/event-stream answers as
  text/event-stream), speaks MCP protocol version 2025-06-18, identifies itself as serverInfo {name: b612,
  version: 0.1.0}, and answers initialize, tools/list AND a tools/call on b612_principles anonymously.
  tools/list returns ten tools, every one with a real inputSchema (JSON Schema draft-07 where it has
  properties) and an execution.taskSupport of "forbidden" — the whole surface is synchronous reference
  lookups. resources/list and prompts/list return -32601 Method not found. The server's initialize
  instructions (Japanese) tell the connecting agent how to work: consult b612_patterns before starting a
  task, pull b612_domain_preset and b612_review_checklist, apply the findings locally, re-check before
  declaring done, and apply b612_rules to code locally — and state plainly that the server has no input for
  source code, so customer code never reaches the provider. The tool names, bilingual titles and the
  Japanese-law vocabulary (景表法/特商法/薬機法) match no shared platform fingerprint: this is a
  provider-built server. Third-party corroboration: listed on Glama as connector com.hakuto-0209/b612
  (endpoint https://mcp.hakuto-0209.com/mcp, 10 tools, "Healthy", last tested 2026-09-20).
deployment:
  mode: remote
  endpoint: https://mcp.hakuto-0209.com/mcp
  auth: api-key
  verified: probed
  install_hint: 'claude mcp add --transport http b612 https://mcp.hakuto-0209.com/mcp --header "x-b612-key: <your key>"'
  note: >-
    A hosted HTTPS endpoint an MCP client POSTs to directly. The provider ships no npm/PyPI package
    (registry.npmjs.org and pypi.org searched for b612/b612-mcp/@hakuto/b612/b612-a2a: nothing first-party)
    and documents no stdio server; the install_hint above is the provider's own one-line quickstart, verbatim
    from https://mcp.hakuto-0209.com/, and it configures a REMOTE connection, not a local process. auth is
    recorded as api-key because that is the documented scheme (x-b612-key license header, per the quickstart
    and the agent card's securitySchemes), but initialize, tools/list and at least b612_principles answer
    WITHOUT a key — the card describes principles and rules as keyless (20 req/min per IP). Which of the
    other tools require the key was not probed. No OAuth metadata is served (/.well-known/oauth-authorization-server
    and /.well-known/oauth-protected-resource both 404 on this host).
servers:
- id: b612
  name: b612
  endpoint: https://mcp.hakuto-0209.com/mcp
  transport: streamable-http
  http_methods: [POST]
  auth: api-key (x-b612-key header; keyless tier for principles/rules)
  status: live
  probe:
    fetched: '2026-09-19'
    initialize:
      http_status: 200
      content_type: text/event-stream
      protocol_version: '2025-06-18'
      server_info: {name: b612, version: 0.1.0}
      capabilities: {tools: {listChanged: true}}
      instructions_excerpt: >-
        b612 は「AI開発レビューの観点＋思考の型＋過去の失敗知」を提供する。… (1) 着手前に必ず b612_patterns を
        「案件のキーワード」で引き … (2) b612_domain_preset と b612_review_checklist で必須項目・エッジケース・
        法令・観点を受け取る … (5) 機械的なコード検査は b612_rules の規則を手元で当てる。 ※このサーバーに
        コード本文を送る口は無い＝顧客コードは提供者に渡らない。
    tools_list:
      http_status: 200
      content_type: text/event-stream
      tool_count: 10
      next_cursor: null
      file: mcp/hakuto-0209-com-mcp-tools.json
    tools_call:
      tool: b612_principles
      arguments: {}
      http_status: 200
      note: Returned the principles text anonymously (content[0].type text, begins "【b612 メソッド — 思考の核】"). No key sent, no code sent.
    resources_list: {http_status: 200, error: '-32601 Method not found'}
    prompts_list: {http_status: 200, error: '-32601 Method not found'}
    get_request: {http_status: 406, content_type: application/json}
    response_headers: [strict-transport-security max-age=63072000, cache-control no-cache no-transform, x-accel-buffering no, server Vercel]
  authorship: provider
  registry_listings:
  - registry: Glama
    url: https://glama.ai/mcp/connectors/com.hakuto-0209/b612
    note: Lists the same endpoint and ten tools; transport shown as "Streamable HTTP · MCP 2025-11-25" (our initialize negotiated 2025-06-18); status Healthy, tested 2026-09-20.
  tools:
  - name: b612_principles
    title: b612 の思考原則
    read_only: true
    input_schema: {}
    a2a_skill: principles
    description: Returns the b612 method's core thinking rules (NO SPECULATION, the three pre-implementation questions, five principles, no swallowed errors).
  - name: b612_review_checklist
    title: b612 レビュー観点（対象別）
    read_only: true
    input_schema: {target_type: 'string, required — one of lp, hp, ec, api, saas, game, form, generic'}
    a2a_skill: review-checklist
    description: Returns the review checklist for a target type; the calling AI performs the review.
  - name: b612_patterns
    title: b612 実戦patterns
    read_only: true
    input_schema: {query: 'string (optional) — keyword, e.g. LINE, 決済, 予約, レスポンシブ', full: 'boolean (optional, default false)', max_chars: 'number (optional, default 20000)'}
    a2a_skill: patterns
    description: Field-tested failure patterns and decisions from real projects (~88,000 chars); heading index by default, matching sections by query.
  - name: b612_domain_preset
    title: b612 ドメインプリセット
    read_only: true
    input_schema: {domain: 'string, required — one of accounting, ai-chat, ai-content-ops, android, beauty, blog, booking, chat, community, corporate, corporate-story, crm, ec, event, fukushi, game, healthcare, hr, instagram, inventory, ios, line, llmo, lms, lp, pos, project, rag, realestate, restaurant, retrogame, saas, seo, subscription, survey, task'}
    a2a_skill: domain-preset
    description: Required data models, edge cases, mandatory Japanese legal checks and anti-patterns per industry.
  - name: b612_rules
    title: b612 検出ルール一覧
    read_only: true
    input_schema: {}
    a2a_skill: rules
    description: >-
      The 31 detection rules (id, severity, why dangerous, how to fix) the calling AI applies to code locally:
      swallow-empty-catch, swallow-catch-comment-only, swallow-nullish-default, swallow-nullish-any,
      supabase-update-without-select, hardcoded-secret, console-log-secret, raf-loop-not-idempotent,
      setinterval-no-clear, top-level-sdk-client, next-force-dynamic, print-transform-scale,
      global-element-selector, img-no-dimensions, destructive-sql, bulk-update-no-where, dangerous-html,
      eval-use, mcp-stdout-log, line-postback-encode, dark-body-light-surface, print-white-text,
      last-child-visual, aspect-ratio-with-object-position, tap-target-too-small, leftover-min-height,
      overflow-hidden-full-height, empty-element-no-fallback, fail-open-secret-check, charge-before-persist,
      fetch-result-ignored.
  - name: b612_design
    title: HP/LP のデザイン規約を引く
    read_only: true
    input_schema: {snippet: 'string (optional) — snippet file name, e.g. cta-shine.css / sticky-cta.js'}
    a2a_skill: null
    description: Design conventions for sites/LPs — prohibited "AI-looking" patterns, required patterns, and paste-ready CSS/JS snippets.
  - name: b612_reference
    title: 実在サイトの参考を引く（Honmono）
    read_only: true
    input_schema: {industry_or_vibe: 'string (optional)', count: 'number (optional)'}
    a2a_skill: null
    description: Real published Japanese sites as design references for an industry or mood, with measured colour palettes and free image sources.
  - name: b612_grow
    title: SNS/note/AEOで売る型を引く（Grow層）
    read_only: true
    input_schema: {product: 'string (optional)', goal: 'string (optional)', channel: 'string (optional)'}
    a2a_skill: null
    description: Go-to-market templates for SNS / note / answer-engine optimisation.
  - name: b612_notes
    title: 公式LINEに送ったメモを読む
    read_only: true
    input_schema: {days: 'number (optional)'}
    a2a_skill: null
    description: Reads memos the licensed user sent to the provider's official LINE account (a per-license personal store; the data policy gives it a 90-day retention).
  - name: b612_update
    title: b612 をアップデートする（資産を最新にする）
    read_only: true
    input_schema: {base_url: 'string (optional)'}
    a2a_skill: null
    description: Returns the procedure the client runs locally to refresh b612's agents, legal files, presets, templates and reference documents. The server changes nothing itself.
crosswalk_note: >-
  No OpenAPI/REST surface exists for b612 (openapi.json, swagger.json, api-docs and docs all 404 on both
  hosts; the A2A card's documentationUrl is the plain-text data policy), so no tool crosswalk is emitted.
  The MCP-to-A2A skill mapping is recorded per tool above (a2a_skill).
